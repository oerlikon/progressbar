name: build

on:
  push:
    branches: [sideline]
  pull_request:
    branches: [sideline]

jobs:
  audit:
    strategy:
      matrix:
        go: [1.25.x, 1.26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: go vet ./...
      - run: go test -vet=off ./...
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          install-go: false
